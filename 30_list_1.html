<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Array/List in javascript</h1>
    <hr>
    <script>
        //create list 
        var fruits = [];
        console.log(fruits);
        //add items at the end of list
        fruits.push("mango");
        fruits.push("banana");
        fruits.push("apple");
        //add items at beginning of list 
        fruits.unshift("kiwi");
        fruits.unshift("graps");
        fruits.unshift("dragon-fruit");
        console.log(fruits);

        //values remove at the end  
        fruits.pop()
        fruits.pop()
        console.log(fruits);
        //value removed at beginning 
        fruits.shift();
        fruits.shift();
        console.log(fruits);
    </script>
</body>

</html>
