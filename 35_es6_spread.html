<body>
    <h1>ES6 spread operator</h1>
    <hr />
    <script>
        var currentCar = {
            make: 'Maruti',
            seat: 4,
            engine: 'petrol',
            color: 'white',
            transmission: 'manual'
        };
        var newCar = {
            make: 'Audi',
            seat: 6,
            engine: 'EV',
            color: 'black',
            price: 5500000
        };
        console.log(currentCar, newCar);
        var myCar = {...currentCar,...newCar};
        console.log(myCar);
    </script>
</body>
