<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Relational Expression (decision making statement)</h1>
    <script>
        var age = parseInt(prompt("Enter Age"));
        var output = '';
        if (age >= 21)
            output = "you are eligible for marriage";
        else if (age >= 18)
            output = "you are eligible for votting and driving license";
        else
            output = "focus on study";

        document.write(output);
    </script>
</body>

</html>
