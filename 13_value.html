<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>value & InnerHTML property</h1>
    <hr />
    <form  method="post" 
        onsubmit="return calculateResult();">
        <table border="1" align="center" cellpadding="5">
            <tr>
                <td>Enter 1st number *</td>
                <td>
                    <input type="number" name="num1" id="num1" required />
                </td>
            </tr>
            <tr>
                <td>
                    Enter 2nd number *
                </td>
                <td>
                    <input type="number" name="num2" id="num2" required />
                </td>
            </tr>
            <tr>
                <td>
                    Select operation
                </td>
                <td>
                    <label for="add">
                        <input type="radio" name="operation" id="add" value="1" 
                        required /> Addition
                    </label>
                    <label for="sub">
                        <input type="radio" name="operation" id="sub" value="2" 
                        required /> Subtraction
                    </label>
                    <label for="mul">
                        <input type="radio" name="operation" id="mul" value="3" 
                        required /> Multiplication
                    </label>
                    <label for="div">
                        <input type="radio" name="operation" id="div" value="4" 
                        required /> Division
                    </label>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="calculate result" />
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center" id="output">
                    result will be displayed here
                </td>
            </tr>
        </table>
    </form>
    <!-- linking exerternal javascript file -->
<script src="calculator.js"></script>
</body>

</html>
