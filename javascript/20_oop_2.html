<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Create object using 2nd method</h1>
    <form action="" onsubmit="return calculateInterest();">
        <table align="center" cellpadding="10" width="50%" border="1">
            <tr>
                <td colspan="2" align="center">
                    <b>Simple Interest Calculator</b>
                </td>
            </tr>
            <tr>
                <td>Enter Amount</td>
                <td>
                    <input type="number" name="amount" id="amount" required />
                </td>
            </tr>
            <tr>
                <td>Enter Rate</td>
                <td>
                     <input type="number" name="rate" id="rate" required />
                </td>
            </tr>
            <tr>
                <td>Enter Year</td>
                <td>
                     <input type="number" name="year" id="year" required />
                </td>
            </tr>
            <tr>
                <td align="center" colspan="2">
                    <input type="submit" name="submit" id="submit" value="calculate Interest" />
                </td>
            </tr>
            <tr>
                <td id="output" colspan="2" align="center"></td>
            </tr>
        </table>
    </form>
    <script>
        //2nd method to create object
        var SimpleInterest = new Object({
            //create property variable
            amount:0,
            rate:0,
            year:0,
            getInput : function(amount,rate,year){
                //initialize property variable
                this.amount = parseInt(amount);
                this.rate = parseInt(rate);
                this.year = parseInt(year);
                console.log("getInput() function called");
            },
            getInterest : function() {
                //local variable
                let Interest = (this.amount * this.rate * this.year) / 100;
                return Interest;
            }
        });
        //1st method to function 
        function calculateInterest()
        {
            //create variables to store user input.
            let amount = document.getElementById("amount").value;
            let rate = document.getElementById('rate').value;
            let year = document.getElementById('year').value;
            //create object variable using object
            let i1 = SimpleInterest;
            i1.getInput(amount,rate,year);
            let interest = i1.getInterest();
            document.getElementById('output').innerHTML = interest;
            return false; //required
        }
        
    </script>
</body>
</html>
