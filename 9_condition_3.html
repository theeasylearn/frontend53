<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Conditional Operator ? ()</h1>
    <script>
        var age = parseInt(prompt("Enter Age"));
        var output = (age>=21) ? "you are eligible for marriage" : (age>=18) ? "you are eligible for voting and driving license " : "you should focus in studies";
        document.write(output);
    </script>
</body>

</html>
